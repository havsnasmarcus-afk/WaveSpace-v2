<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23065E7F%27/%3E%3Cpath d=%27M4 19c3-5 5-5 8 0s5 5 8 0 5-5 8 0%27 fill=%27none%27 stroke=%27%23FEFCF5%27 stroke-width=%273%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <title>My locker · WaveSpace</title>
</head>
<body>
  <header id="nav"></header>
  <main id="locker" class="mx-auto max-w-[1240px] px-6 pb-20 pt-10">
    <div class="skeleton h-96"></div>
  </main>

  <dialog id="billing">
    <form id="billing-form" class="space-y-3 p-7" novalidate>
      <div class="flex items-start justify-between gap-4">
        <h2 class="display text-xl">Update billing method</h2>
        <button type="button" id="billing-close" class="text-2xl leading-none text-muted hover:text-ink" aria-label="Close">×</button>
      </div>
      <p class="text-sm text-muted">Simulated — nothing is charged. Use 4242 4242 4242 4242 to test.</p>
      <div id="billing-errors"></div>
      <input class="input" name="card_number" inputmode="numeric" autocomplete="cc-number" placeholder="1234 5678 9012 3456" aria-label="Card number">
      <div class="grid grid-cols-2 gap-3">
        <input class="input" name="expiry" inputmode="numeric" autocomplete="cc-exp" placeholder="MM / YY" aria-label="Expiry date">
        <input class="input" name="cvc" inputmode="numeric" autocomplete="cc-csc" placeholder="CVC" maxlength="4" aria-label="CVC">
      </div>
      <button id="billing-save" class="btn btn-coral w-full">Save card</button>
    </form>
  </dialog>
  <script type="module" src="js/account.js"></script>
</body>
</html>
