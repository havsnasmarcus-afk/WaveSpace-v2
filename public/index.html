<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23065E7F%27/%3E%3Cpath d=%27M4 19c3-5 5-5 8 0s5 5 8 0 5-5 8 0%27 fill=%27none%27 stroke=%27%23FEFCF5%27 stroke-width=%273%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <title>Map · WaveSpace</title>
</head>
<body>
  <header id="nav"></header>
  <main class="mx-auto max-w-[1240px] px-6 pb-20 pt-10">
    <h1 class="display text-[2.4rem] leading-[1.06] sm:text-5xl lg:text-[3.4rem]">Leave the board.<br>Not the beach.</h1>
    <p class="mt-4 text-muted">Tap a pin to see free lockers. The number on each pin is how many are free right now.</p>

    <div class="mt-8 grid gap-6 lg:grid-cols-[minmax(0,1fr)_360px]">
      <div id="map" class="beach-map" role="application" aria-label="Interactive map of locker beaches">
        <div class="skeleton absolute inset-0" style="border-radius:0"></div>
      </div>
      <aside id="side" class="space-y-3" aria-live="polite">
        <div class="skeleton h-56"></div>
      </aside>
    </div>
  </main>
  <script type="module" src="js/index.js"></script>
</body>
</html>
